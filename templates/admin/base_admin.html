<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Admin | MS CodeForge{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="admin-body">
<header class="admin-header"><a href="{{ url_for('admin_dashboard') }}">MS <span>CodeForge</span> / Admin</a><nav><a href="{{ url_for('admin_dashboard') }}">Dashboard</a><a href="{{ url_for('admin_products') }}">Products</a><a href="{{ url_for('admin_news') }}">Updates</a><a href="{{ url_for('admin_messages') }}">Messages</a><form method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="link-button">Sign out</button></form></nav></header>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-wrap">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
<main class="admin-main">{% block content %}{% endblock %}</main>
</body></html>
