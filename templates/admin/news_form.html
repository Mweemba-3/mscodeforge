{% extends "admin/base_admin.html" %}
{% block content %}
<div class="admin-title"><div><p class="eyebrow">PUBLISHING</p><h1>{{ heading }}</h1></div><a class="text-link" href="{{ url_for('admin_news') }}">← Back to updates</a></div>
<form method="post" class="form-panel admin-form">{{ form.hidden_tag() }}<label>{{ form.title.label }}{{ form.title() }}</label><label>{{ form.summary.label }}{{ form.summary() }}</label><label>{{ form.body.label }}{{ form.body(rows="12") }}</label><label class="check-label">{{ form.published() }} {{ form.published.label.text }}</label>{{ form.submit(class="button") }}</form>
{% endblock %}
